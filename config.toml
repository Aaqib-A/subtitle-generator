[theme]
primaryColor = "#2E5EAA"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F3F8"
textColor = "#1B1F23"
font = "sans serif"

[server]
headless = true
# Max size (MB) for a single file_uploader upload. Streamlit's default is 200.
# Set high enough to effectively remove the cap for large video files.
maxUploadSize = 20000
